<style>

.vlist{display:flex;flex-direction:column;gap:9px}.vitem{background:#fff;border:1px solid var(--bd);border-radius:11px;padding:13px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}.vitem:hover{border-color:#93cfc9}.vitem .r{text-align:right;font-size:12px;color:var(--mut)}

.m-ok{color:var(--grn);font-weight:800}.m-warn{color:var(--amb);font-weight:800}.m-due{color:var(--red);font-weight:800}

body.inapp nav{display:flex}.nav-brand{display:flex;align-items:center;gap:12px;padding:4px 8px 24px;margin-bottom:10px;border-bottom:1px solid rgba(255,255,255,.1)}.nav-brand img{width:42px;height:42px;border-radius:12px;background:#fff;object-fit:cover}.nav-brand strong{display:block;color:#fff;font-size:15px;letter-spacing:.4px}.nav-brand small{display:block;color:#8fb0c9;font-size:10px;margin-top:2px;letter-spacing:.8px;text-transform:uppercase}
nav button{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:12px 13px;border:0;border-radius:10px;background:transparent;color:#b7cad8;font-size:13px;font-weight:700;cursor:pointer;text-align:left;margin:2px 0}nav button:hover{background:rgba(255,255,255,.07);color:#fff}nav button.act{background:rgba(18,179,168,.18);color:#fff}nav button.act::before{content:"";position:absolute;left:-16px;width:3px;height:24px;border-radius:0 4px 4px 0;background:linear-gradient(var(--teal),var(--lime))}.nav-icon{display:flex;align-items:center;justify-content:center;width:24px;height:24px;font-size:16px;color:#8ddbd4}.nav-label{display:block}

.notice-body{white-space:pre-wrap;font-size:14px;line-height:1.7;margin:10px 0;max-height:45vh;overflow-y:auto}

.audit-change{display:block;max-width:360px;white-space:normal;line-height:1.45;color:#40566a}
#login{min-height:100vh;display:flex;align-items:center;justify-content:flex-end;padding:32px clamp(44px,8vw,150px) 32px 24px;position:relative;isolation:isolate;background:#f7fbfd url("fleet-login-bg.png") center center/cover no-repeat}

@media print{header,nav,.tabs,#toast,.stat,button{display:none!important}body,body.inapp{padding:0;background:#fff}.card,.panel{box-shadow:none;border:0}main{padding:0;max-width:none}#aBody>.card:first-child{display:none}}
</style>

const HANGUL_INITIAL=[..."ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ"];
const HANGUL_MEDIAL=[..."ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ"];
const HANGUL_FINAL=["",..."ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ"];
const HANGUL_COMPOUND_MEDIAL={"ㅗㅏ":"ㅘ","ㅗㅐ":"ㅙ","ㅗㅣ":"ㅚ","ㅜㅓ":"ㅝ","ㅜㅔ":"ㅞ","ㅜㅣ":"ㅟ","ㅡㅣ":"ㅢ"};
const HANGUL_COMPOUND_FINAL={"ㄱㅅ":"ㄳ","ㄴㅈ":"ㄵ","ㄴㅎ":"ㄶ","ㄹㄱ":"ㄺ","ㄹㅁ":"ㄻ","ㄹㅂ":"ㄼ","ㄹㅅ":"ㄽ","ㄹㅌ":"ㄾ","ㄹㅍ":"ㄿ","ㄹㅎ":"ㅀ","ㅂㅅ":"ㅄ"};
function modernJamoToCompatibility(char){
  const code=char.codePointAt(0);
  if(code>=0x1100&&code<=0x1112) return HANGUL_INITIAL[code-0x1100];
  if(code>=0x1161&&code<=0x1175) return HANGUL_MEDIAL[code-0x1161];
  if(code>=0x11a8&&code<=0x11c2) return HANGUL_FINAL[code-0x11a8+1];
  return char;
}
function composeCompatibilityJamo(value){
  const chars=Array.from(String(value??"").normalize("NFD"),modernJamoToCompatibility);
  let out="",i=0;
  while(i<chars.length){
    const initial=HANGUL_INITIAL.indexOf(chars[i]),firstMedial=chars[i+1];
    let medial=HANGUL_MEDIAL.indexOf(firstMedial);
    if(initial<0||medial<0){ out+=chars[i++]; continue; }
    i+=2;
    const compoundMedial=HANGUL_COMPOUND_MEDIAL[firstMedial+(chars[i]||"")];
    if(compoundMedial){ medial=HANGUL_MEDIAL.indexOf(compoundMedial); i++; }
    let final=0;
    const firstFinal=chars[i],firstFinalIndex=HANGUL_FINAL.indexOf(firstFinal);
    if(firstFinalIndex>0&&!HANGUL_MEDIAL.includes(chars[i+1])){
      let finalChar=firstFinal; i++;
      const compoundFinal=HANGUL_COMPOUND_FINAL[finalChar+(chars[i]||"")];
      if(compoundFinal&&!HANGUL_MEDIAL.includes(chars[i+1])){ finalChar=compoundFinal; i++; }
      final=HANGUL_FINAL.indexOf(finalChar);
    }
    out+=String.fromCodePoint(0xac00+(initial*21+medial)*28+final);
  }
  return out.normalize("NFC");
}
function normalizeCredential(value,trim=false){
  const normalized=composeCompatibilityJamo(String(value??"").replace(/[\u200B-\u200D\u2060\uFEFF]/g,""));
  return trim?normalized.trim():normalized;
}
function passwordMatches(account,entered){
  const stored=normalizeCredential(account?.pw,true), value=normalizeCredential(entered,true);
  return account?.pwCaseInsensitive===true?stored.toLowerCase()===value.toLowerCase():stored===value;
}
function isLegacyInitialPassword(account){
  return !!account&&normalizeCredential(account.pw,true)===normalizeCredential(account.name,true);
}
function accountPasswordState(account){

}
function validNewPassword(value){

function auditSafe(value){
  if(value==null||typeof value!=="object") return value;
  if(Array.isArray(value)) return value.map(auditSafe);
  const out={};
  for(const [key,item] of Object.entries(value)) out[key]=/pw|password/i.test(key)?"[보호됨]":auditSafe(item);
  return out;
}
function auditRecord({operation,collection,targetId,label,before,after,reason}){

async function auditedMutation({operation,collection,id,before,after,reason,label}){
  if(!isAdmin()) throw new Error("관리자만 변경할 수 있습니다");
  const why=String(reason||"").trim();
  if((operation==="update"||operation==="delete")&&!why) throw new Error("변경 사유를 입력하세요");
  const recordedAfter=operation==="update"?{...(before||{}),...(after||{})}:after;
  let targetId=id||"";
  if(useFB){
    const targetRef=id?fdb.collection(collection).doc(id):fdb.collection(collection).doc();
    targetId=targetRef.id;
    const logRef=fdb.collection("auditLogs").doc();
    const batch=fdb.batch();
    if(operation==="create") batch.set(targetRef,after);
    else if(operation==="update") batch.set(targetRef,after,{merge:true});
    else if(operation==="delete") batch.delete(targetRef);
    else throw new Error("지원하지 않는 변경 작업입니다");
    batch.set(logRef,{...auditRecord({operation,collection,targetId,label,before,after:recordedAfter,reason:why}),serverAt:firebase.firestore.FieldValue.serverTimestamp()});
    await batch.commit();
    return targetId;
  }
  if(collection==="settings"&&id==="main") await saveSettings(after);
  else if(operation==="create") targetId=await dbAdd(collection,{...after});
  else if(operation==="update") await dbUpd(collection,id,after);
  else if(operation==="delete") await dbDel(collection,id);
  await dbAdd("auditLogs",auditRecord({operation,collection,targetId,label,before,after:recordedAfter,reason:why}));
  return targetId;
}

async function adminProfileForUser(user){
  const email=normalizedEmail(user?.email);

async function cleanupLegacyAdminCredentials(){

async function requestAdminGoogleLogin(){
  if(!fauth||!useFB) return toast("Firebase 연결이 필요합니다");
  try{
    await fauth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    const provider=new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({prompt:"select_account"});
    const result=await fauth.signInWithPopup(provider),profile=await adminProfileForUser(result.user);
    if(!profile){ await fauth.signOut(); return toast("관리자로 등록되지 않은 Google 계정입니다"); }
    await ensureSeed(); await loadCore();
    seenNotices.clear(); aTab="status"; fleetStatusFilter="running";
    SESSION=createAdminSession(result.user,profile); saveSession();
    try{ await cleanupLegacyAdminCredentials(); }catch(e){ console.warn("기존 관리자 인증정보 정리 실패",e); }
    await enterApp(true);
  }catch(e){

    if(fauth?.currentUser) try{await fauth.signOut();}catch(signOutError){console.warn(signOutError);}
    toast(e?.code==="auth/popup-closed-by-user"?"Google 로그인이 취소되었습니다":"Google 관리자 로그인에 실패했습니다");
  }
}

const seenNotices=new Set();
function localDateTimeKey(d=new Date()){ return localDateValue(d)+"T"+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function noticeStartKey(n){ return n.startDate&&n.startTime?`${n.startDate}T${n.startTime}`:""; }
function noticeEndKey(n){ return n.endDate&&n.endTime?`${n.endDate}T${n.endTime}`:""; }
function noticeWindowState(n,nowKey=localDateTimeKey()){
  if(n.active===false) return {key:"disabled",label:"게시 중단",level:"unknown"};
  const start=noticeStartKey(n),end=noticeEndKey(n);
  if(!start||!end) return {key:"active",label:"게시 중",level:"run",legacy:true};
  if(nowKey<start) return {key:"scheduled",label:"게시 예정",level:"warn"};
  if(nowKey>=end) return {key:"ended",label:"게시 종료",level:"unknown"};
  return {key:"active",label:"게시 중",level:"run"};
}
function noticeScheduleLabel(n){
  const start=noticeStartKey(n),end=noticeEndKey(n);
  return start&&end?`${n.startDate} ${n.startTime} ~ ${n.endDate} ${n.endTime}`:"기존 공지 · 게시 기간 미설정";
}
function noticeHideKey(id){
  const viewer=isAdmin()?`admin:${SESSION?.operatorName||SESSION?.aid||""}`:(SESSION?.aid||"guest");
  return `jhc2_nhide_${viewer}_${id}`;
}
async function showNotices(){
  const ns=(await dbAll("notices")).filter(n=>noticeWindowState(n).key==="active").sort((a,b)=>(noticeStartKey(b)||b.date||"").localeCompare(noticeStartKey(a)||a.date||""));
  const show=ns.filter(n=>!seenNotices.has(n.id)&&localStorage.getItem(noticeHideKey(n.id))!==todayStr());
  if(!show.length) return;
  const n=show[0];
  modal(`<h3>📢 ${esc(n.title)}</h3><p class="sub">${esc(noticeScheduleLabel(n))} · 총무부(관리부서)</p>
  <div class="notice-body">${esc(n.body)}</div>
  ${show.length>1?`<p class="sub">외 공지 ${show.length-1}건 — 닫으면 이어서 표시됩니다.</p>`:""}
  <div class="chk" style="display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mut)"><input type="checkbox" id="nHide" style="width:auto"><label for="nHide" style="margin:0">오늘 하루 이 공지 열지 않기</label></div>
  <button class="btn" onclick="closeNotice('${n.id}')">닫기</button>`);
}
function closeNotice(id){
  if($("#nHide")&&$("#nHide").checked) localStorage.setItem(noticeHideKey(id),todayStr());

}

function maintAlerts(plate,trips,recs){
  const cur=lastKm(trips); const out=[];
  for(const it of MAINT_ITEMS){
    const last=recs.filter(r=>r.vehicle===plate&&r.item===it.name).sort((a,b)=>b.date.localeCompare(a.date))[0];
    if(!last) continue;
    if(it.km&&cur){ const rem=it.km-(cur-(+last.km||0));
      if(rem<=0) out.push(`<span class="m-due">${esc(it.name)} 교체시기 ${fmt(-rem)}km 초과</span>`);
      else if(rem<=1000) out.push(`<span class="m-warn">${esc(it.name)} ${fmt(rem)}km 남음</span>`);}
    if(it.mo){ const due=new Date(last.date); due.setMonth(due.getMonth()+it.mo);
      const dd=Math.round((due-new Date())/864e5);
      if(dd<=0) out.push(`<span class="m-due">${esc(it.name)} 교체기간 경과</span>`);
      else if(dd<=30) out.push(`<span class="m-warn">${esc(it.name)} ${dd}일 남음</span>`);}
  }
  return out.length?`<div class="banner warn" style="font-weight:400">🔧 <b>소모품 알림</b><br>${out.join(" · ")}</div>`:"";
}

/* ═══════════ Fleet Command 요약 계산 ═══════════ */
function localDateValue(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function maintenanceState(plate,trips,recs){
  const cur=lastKm(trips), alerts=[];
  for(const it of MAINT_ITEMS){
    const last=recs.filter(r=>r.vehicle===plate&&r.item===it.name).sort((a,b)=>b.date.localeCompare(a.date))[0];
    if(!last) continue;
    let level="ok", label="정상", nextDate="";
    if(it.km&&cur){
      const rem=it.km-(cur-(+last.km||0));
      if(rem<=0){ level="due"; label=`${fmt(-rem)}km 초과`; }
      else if(rem<=1000){ level="warn"; label=`${fmt(rem)}km 남음`; }
      else label=`${fmt(rem)}km 남음`;
    }
    if(it.mo){
      const due=new Date(last.date+"T00:00:00"); due.setMonth(due.getMonth()+it.mo);
      nextDate=localDateValue(due);
      const dd=Math.ceil((due-new Date())/864e5);
      if(dd<=0){ level="due"; label="기간 경과"; }
      else if(dd<=30&&level!=="due"){ level="warn"; label=`${dd}일 남음`; }
    }
    alerts.push({plate,item:it.name,level,label,lastDate:last.date,nextDate,cost:+last.cost||0,km:+last.km||0});
  }
  const level=alerts.some(a=>a.level==="due")?"due":alerts.some(a=>a.level==="warn")?"warn":alerts.length?"ok":"unknown";
  return {level,alerts,cur};
}
function vehicleOperationalState(v,trips,recs){
  const vt=trips.filter(t=>t.vehicle===v.plate), running=openTrip(vt), maint=maintenanceState(v.plate,vt,recs);
  if(running) return {level:"run",label:"운행 중",running,maint};
  if(maint.level==="due") return {level:"due",label:"점검 필요",running:null,maint};
  if(maint.level==="warn") return {level:"warn",label:"점검 예정",running:null,maint};
  if(maint.level==="unknown") return {level:"unknown",label:"점검 이력 없음",running:null,maint};
  return {level:"ok",label:"운행 가능",running:null,maint};
}
function statusBadge(state){ return `<span class="status-pill ${state.level}">${esc(state.label)}</span>`; }

async function startDrive(plate,pubRequired){
  if(!canAccessVehicle(plate)) return denyVehicleAccess();
  const v=visibleVehicles().find(x=>x.plate===plate); if(!v) return denyVehicleAccess();
  const dept=$("#drvDept")?$("#drvDept").value:SESSION.dept;
  const name=$("#drvName")?$("#drvName").value:SESSION.name;
  const km=$("#startKm").value, pur=($("#purpose")?$("#purpose").value.trim():"");

  if(pubRequired&&isSalesDept(dept)) return toast("영업부서는 공용차량을 이용할 수 없습니다");
  if(!km) return toast("시작 키로수를 입력하세요");
  if(pubRequired&&!pur) return toast("공용차량은 운행 목적을 반드시 입력해야 합니다");

  toast(off?"⚠️ 휴무일 운행 시작 기록됨":"운행 시작 기록됨"); nav(VIEW);
}
async function endDrive(id,startKm){
  const trip=(await dbAll("trips")).find(t=>t.id===id);
  if(!trip||!canAccessVehicle(trip.vehicle)) return denyVehicleAccess();
  if(!isAdmin()&&trip.uid!==SESSION.aid) return toast("본인이 시작한 운행만 종료할 수 있습니다");

  await dbUpd("trips",id,{endKm:e,dist:e-startKm,endDate:todayStr(),endTime:nowTime(),status:"완료"});
  toast(`운행 종료 · ${fmt(e-startKm)} km`); nav(VIEW);
}

  const vlist=visibleVehicles();
  if(!vlist.length){ $("#app").innerHTML=`<div class="card"><div class="empty-state"><strong>조회 차량 없음</strong>정비 이력을 확인할 차량이 없습니다.</div></div>`; return; }

  const plates=new Set(vlist.map(v=>v.plate)), allTrips=await dbAll("trips"), allRecs=(await dbAll("maintenance")).filter(r=>plates.has(r.vehicle));

async function saveMaint(item,tire){

  if(!d||!k) return toast("일자와 키로수를 입력하세요");
  const rec={vehicle:mPlate,item,date:d,km:+k,shop:$("#mShop").value.trim(),cost:+($("#mCost").value||0),memo:$("#mMemo").value.trim(),uid:SESSION.aid,by:isAdmin()?(SESSION.operatorName||SESSION.name):SESSION.name};
  if(tire){ rec.tireF=+$("#mTf").value; rec.tireR=+$("#mTr").value;
    if(!rec.tireF&&!rec.tireR) return toast("교체한 타이어 개수를 선택하세요"); }
  if(item==="타이어"&&!rec.shop) return toast("정비소 이름을 입력하세요");
  if(isAdmin()){
    const reason=$("#mReason")?.value.trim(); if(!reason) return toast("등록 사유를 입력하세요");

  }else await dbAdd("maintenance",rec);
  closeModal(); toast("교체 기록 저장됨"); nav("maint");
}

async function saveTripEdit(id){
  const before=(await dbAll("trips")).find(x=>x.id===id); if(!before) return toast("운행 기록을 찾을 수 없습니다");
  const date=$("#etDate").value,vehicle=$("#etVehicle").value,dept=$("#etDept").value.trim(),user=$("#etUser").value.trim(),status=$("#etStatus").value,endDate=$("#etEndDate").value;
  const startKm=Number($("#etStartKm").value), endRaw=$("#etEndKm").value, endKm=endRaw===""?null:Number(endRaw), reason=$("#etReason").value.trim();
  if(!date||!vehicle||!dept||!user||!$("#etStartTime").value) return toast("날짜, 차량, 부서, 사용자, 시작 시각은 필수입니다");
  if(!Number.isFinite(startKm)||startKm<0) return toast("시작 km를 확인하세요");
  if(status==="완료"&&(!Number.isFinite(endKm)||endKm<startKm)) return toast("완료 기록의 종료 km는 시작 km 이상이어야 합니다");
  if(status==="완료"&&(!endDate||!$("#etEndTime").value)) return toast("완료 기록의 종료 일자와 시각을 입력하세요");
  if(!reason) return toast("변경 사유를 입력하세요");
  const v=VEHICLES.find(x=>x.plate===vehicle);
  const patch={date,vehicle,model:v?.model||before.model||"",dept,user,startTime:$("#etStartTime").value,endDate:status==="완료"?endDate:"",endTime:status==="완료"?$("#etEndTime").value:"",startKm,endKm:status==="완료"?endKm:null,dist:status==="완료"?endKm-startKm:null,purpose:$("#etPurpose").value.trim(),status,offday:isOffday(date)};
  await auditedMutation({operation:"update",collection:"trips",id,before,after:patch,reason,label:`${before.vehicle} ${before.date} ${before.user}`});
  closeModal(); toast("운행 기록이 수정되었습니다"); nav("admin");
}

async function dlBook(){
  const from=$("#bF").value,to=$("#bT").value,only=$("#bV").value;
  const trips=(await dbAll("trips")).filter(t=>!isRunningTrip(t)&&(!from||t.date>=from)&&(!to||t.date<=to)).sort((a,b)=>(a.date+(a.startTime||"")).localeCompare(b.date+(b.startTime||"")));

      ["과세기간:",from+" ~ "+to,"","법인명:",COMPANY],

      ...rows.map(t=>[t.date,t.dept,t.user,t.startKm,t.endKm,t.dist,t.dist,(t.purpose||"")+(t.offday?" [휴무일 운행]":"")]),
      [],
      ["과세기간 합계","","","","",total,total,""],
      ["업무사용비율","100%"]

async function saveAdminAccess(){
  if(!isRootAdmin()) return toast("최초 관리자 가세현만 변경할 수 있습니다");
  if(!useFB) return toast("Firebase 연결이 필요합니다");
  const reason=$("#adminAccessReason")?.value.trim();
  if(!reason) return toast("변경 사유를 입력하세요");
  const editable=ADMIN_OPERATORS.filter(name=>name!==ROOT_ADMIN_NAME);
  const next=editable.map(name=>{
    const index=ADMIN_OPERATORS.indexOf(name);
    return {name,index,email:normalizedEmail($("#adminEmail"+index)?.value)};
  });
  const invalid=next.find(x=>x.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x.email));
  if(invalid) return toast(`${invalid.name}의 이메일 형식을 확인하세요`);
  const emails=next.map(x=>x.email).filter(Boolean);
  if(new Set(emails).size!==emails.length||emails.includes(ROOT_ADMIN_EMAIL)) return toast("관리자별로 서로 다른 Google 계정을 입력하세요");
  const current=await dbAll("adminAccess"),byName=new Map(current.map(x=>[x.name,x]));
  const batch=fdb.batch(); let changes=0;
  function addAudit(operation,targetId,label,before,after){
    const logRef=fdb.collection("auditLogs").doc();
    batch.set(logRef,{...auditRecord({operation,collection:"adminAccess",targetId,label,before,after,reason}),serverAt:firebase.firestore.FieldValue.serverTimestamp()});
  }
  for(const item of next){
    const before=byName.get(item.name),oldEmail=normalizedEmail(before?.email||before?.id||"");
    if(before&&oldEmail!==item.email){
      batch.delete(fdb.collection("adminAccess").doc(before.id));
      addAudit("delete",before.id,`${item.name} · ${oldEmail}`,before,null); changes++;
    }
    if(item.email&&oldEmail!==item.email){
      const after={name:item.name,email:item.email,active:true,order:item.index+1,updatedAt:new Date().toISOString()};
      batch.set(fdb.collection("adminAccess").doc(item.email),after);
      addAudit("create",item.email,`${item.name} · ${item.email}`,null,after); changes++;
    }else if(item.email&&before&&(before.active===false||before.order!==item.index+1||before.email!==item.email)){
      const after={name:item.name,email:item.email,active:true,order:item.index+1,updatedAt:new Date().toISOString()};
      batch.set(fdb.collection("adminAccess").doc(item.email),after,{merge:true});
      addAudit("update",item.email,`${item.name} · ${item.email}`,before,{...before,...after}); changes++;
    }
  }
  if(!changes) return toast("변경된 관리자 계정이 없습니다");
  await batch.commit(); toast("Google 관리자 계정이 저장되었습니다"); nav("admin");
}

  const extraHolidays=$("#exh").value.trim(),reason=$("#exhReason").value.trim(); if(!reason) return toast("변경 사유를 입력하세요");
  await auditedMutation({operation:"update",collection:"settings",id:"main",before:{extraHolidays:SETTINGS.extraHolidays||""},after:{extraHolidays},reason,label:"추가 휴무일"});
  SETTINGS.extraHolidays=extraHolidays; toast("저장됨");
}

/* ═══════════ 관리자 변경 이력 (append-only) ═══════════ */
const AUDIT_COLLECTION_LABELS={trips:"운행 기록",maintenance:"정비 기록",vehicles:"차량",accounts:"직원·계정",notices:"공지",settings:"앱 설정",adminAccess:"관리자 권한"};
const AUDIT_OPERATION_LABELS={create:"등록",update:"수정",delete:"삭제"};
const AUDIT_FIELD_LABELS={date:"날짜",vehicle:"차량",model:"차종",dept:"부서",user:"사용자",startDate:"시작 일자",startTime:"시작 시간",endDate:"종료 일자",endTime:"종료 시간",startKm:"시작 km",endKm:"종료 km",dist:"운행거리",purpose:"목적·비고",status:"상태",offday:"휴무일",item:"정비 항목",km:"정비 km",shop:"정비소",cost:"비용",tireF:"앞 타이어",tireR:"뒤 타이어",memo:"메모",plate:"차량번호",type:"유형",cat:"구분",active:"활성 상태",name:"이름",email:"Google 계정",order:"표시 순서",userId:"ID",vehicles:"지정 차량",title:"제목",body:"내용",extraHolidays:"추가 휴무일"};
function auditDate(log){
  try{ if(log.serverAt?.toDate) return log.serverAt.toDate(); }catch(e){}
  const d=new Date(log.createdAt||0); return Number.isNaN(d.getTime())?new Date(0):d;
}
function auditDateKey(log){ const d=auditDate(log); return localDateValue(d); }
function auditWhen(log){
  const d=auditDate(log); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0");
}
function auditChangedFields(log){
  if(log.operation==="create") return "신규 기록 전체";
  if(log.operation==="delete") return "삭제 전 기록 전체";
  const before=log.before||{},after=log.after||{};
  const keys=[...new Set([...Object.keys(before),...Object.keys(after)])].filter(k=>JSON.stringify(before[k])!==JSON.stringify(after[k]));
  return keys.length?keys.map(k=>AUDIT_FIELD_LABELS[k]||k).join(", "):"변경 필드 확인 필요";
}
let auditFilters={operator:"",collection:"",operation:"",from:"",to:""};
function applyAuditFilters(){
  auditFilters={operator:$("#auditOperator")?.value||"",collection:$("#auditCollection")?.value||"",operation:$("#auditOperation")?.value||"",from:$("#auditFrom")?.value||"",to:$("#auditTo")?.value||""}; nav("admin");
}
function resetAuditFilters(){ auditFilters={operator:"",collection:"",operation:"",from:"",to:""}; nav("admin"); }
async function aAudit(){
  const all=(await dbAll("auditLogs")).sort((a,b)=>auditDate(b)-auditDate(a)),f=auditFilters;
  const operators=[...new Set(all.map(x=>x.operatorName).filter(Boolean))].sort(),collections=[...new Set(all.map(x=>x.collection).filter(Boolean))].sort();
  const rows=all.filter(x=>(!f.operator||x.operatorName===f.operator)&&(!f.collection||x.collection===f.collection)&&(!f.operation||x.operation===f.operation)&&(!f.from||auditDateKey(x)>=f.from)&&(!f.to||auditDateKey(x)<=f.to));
  $("#aBody").innerHTML=`<div class="banner info">감사 로그는 추가만 가능하며 앱에는 수정·삭제 기능이 없습니다. Firestore 규칙에서도 <b>update/delete가 거부</b>됩니다.</div>
  <div class="card"><div class="filter-bar"><div><label>접속자</label><select id="auditOperator"><option value="">전체 접속자</option>${operators.map(n=>`<option value="${esc(n)}" ${f.operator===n?"selected":""}>${esc(n)}</option>`).join("")}</select></div><div><label>관리 영역</label><select id="auditCollection"><option value="">전체 영역</option>${collections.map(c=>`<option value="${esc(c)}" ${f.collection===c?"selected":""}>${esc(AUDIT_COLLECTION_LABELS[c]||c)}</option>`).join("")}</select></div><div><label>작업</label><select id="auditOperation"><option value="">전체 작업</option>${Object.entries(AUDIT_OPERATION_LABELS).map(([k,v])=>`<option value="${k}" ${f.operation===k?"selected":""}>${v}</option>`).join("")}</select></div><div><label>시작일</label><input type="date" id="auditFrom" value="${esc(f.from)}"></div><div><label>종료일</label><input type="date" id="auditTo" value="${esc(f.to)}"></div></div><div class="btn-row"><button class="btn" onclick="applyAuditFilters()">필터 적용</button><button class="btn sec" onclick="resetAuditFilters()">초기화</button></div></div>
  <div class="card table-card"><div class="panel-head" style="padding:20px 20px 0"><div><h2>관리자 변경 이력</h2><p class="sub">검색 결과 ${rows.length}건 · 최근순 최대 200건 표시</p></div></div><div class="tbl-wrap"><table><thead><tr><th>일시</th><th>접속자</th><th>작업</th><th>관리 영역</th><th>대상</th><th>변경 필드</th><th>사유</th><th></th></tr></thead><tbody>${rows.slice(0,200).map(log=>`<tr><td>${esc(auditWhen(log))}</td><td><b>${esc(log.operatorName||"미확인")}</b></td><td><span class="tag ${log.operation==="delete"?"off":log.operation==="create"?"pub":"prv"}">${esc(AUDIT_OPERATION_LABELS[log.operation]||log.operation)}</span></td><td>${esc(AUDIT_COLLECTION_LABELS[log.collection]||log.collection)}</td><td>${esc(log.label||log.targetId||"")}</td><td><span class="audit-change">${esc(auditChangedFields(log))}</span></td><td><span class="audit-change">${esc(log.reason||"")}</span></td><td><button class="btn sm sec" onclick="showAuditDetail('${log.id}')">상세</button></td></tr>`).join("")||"<tr><td colspan=8>변경 이력이 없습니다.</td></tr>"}</tbody></table></div></div>`;
}
async function showAuditDetail(id){
  const log=(await dbAll("auditLogs")).find(x=>x.id===id); if(!log) return toast("감사 로그를 찾을 수 없습니다");
  const detail={일시:auditWhen(log),관리자접속자명:log.operatorName,작업:AUDIT_OPERATION_LABELS[log.operation]||log.operation,관리영역:AUDIT_COLLECTION_LABELS[log.collection]||log.collection,대상:log.label,사유:log.reason,변경전:log.before,변경후:log.after};
  modal(`<h3>변경 이력 상세</h3><p class="sub">이 기록은 수정하거나 삭제할 수 없습니다.</p><pre class="audit-detail">${esc(JSON.stringify(detail,null,2))}</pre><button class="btn sec" onclick="closeModal()">닫기</button>`);
}

/* ═══════════ 시작 ═══════════ */
async function waitForAuthReady(){
  if(!fauth) return;
  await new Promise(resolve=>{
    let settled=false,unsubscribe=()=>{};
    const done=()=>{ if(settled) return; settled=true; unsubscribe(); resolve(); };
    unsubscribe=fauth.onAuthStateChanged(done,done);
    setTimeout(done,5000);
  });
}
(async function(){
  try{ await ensureSeed(); await loadCore(); }catch(e){ console.warn(e); }
  loadSession();
  await waitForAuthReady();
  if(SESSION?.role==="admin"){
    if(await restoreAdminSession()){
      try{ await cleanupLegacyAdminCredentials(); }catch(e){ console.warn("기존 관리자 인증정보 정리 실패",e); }
      enterApp(true);
    }else{
      SESSION=null; localStorage.removeItem("jhc2_sess"); renderLogin("관리자 인증이 만료되었습니다. Google 계정으로 다시 로그인하세요.");
    }
  }else if(SESSION){
    if(fauth?.currentUser) try{await fauth.signOut();}catch(e){console.warn(e);}
    enterApp(true);
  }else{
    if(fauth?.currentUser) try{await fauth.signOut();}catch(e){console.warn(e);}
    renderLogin();
  }
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
