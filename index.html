<style>
:root{--navy:#414b5a;--navy-d:#323a46;--teal:#12b3a8;--bg:#f1f5f9;--card:#fff;--txt:#0f172a;--mut:#64748b;--red:#dc2626;--grn:#16a34a;--amb:#d97706;--bd:#e2e8f0}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--txt)}
body.inapp{padding-bottom:70px}
header{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:10;display:none;align-items:center;justify-content:space-between}
body.inapp header{display:flex}
header h1{font-size:16px;font-weight:700}
header .u{font-size:12px;display:flex;align-items:center;gap:8px}
header .u button{background:rgba(255,255,255,.18);border:none;color:#fff;font-size:11px;padding:4px 9px;border-radius:10px;cursor:pointer}
.badge{font-size:10px;padding:2px 7px;border-radius:10px;background:rgba(255,255,255,.2)}
.badge.on{background:var(--grn)}
main{padding:14px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h2{font-size:15px;margin-bottom:10px;color:var(--navy)}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;background:var(--navy);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}
.btn.sec{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn.red{background:var(--red)}
.btn.grn{background:var(--grn)}
.btn.teal{background:var(--teal)}
.btn.sm{padding:8px 12px;font-size:13px;width:auto;display:inline-block;margin:4px 4px 0 0}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:8px;font-size:16px;background:#fff}
.banner{border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:14px;font-weight:700}
.banner.warn{background:#fef2f2;color:var(--red);border:1px solid #fecaca}
.banner.info{background:#f0fdfa;color:#0f766e;border:1px solid #99f6e4}
.plate{font-size:22px;font-weight:800;letter-spacing:1px}
.sub{font-size:13px;color:var(--mut);margin-top:2px}
.kmbig{font-size:26px;font-weight:800;color:var(--navy)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.vlist{display:flex;flex-direction:column;gap:8px}
.vitem{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.vitem:active{background:#f0fdfa}
.vitem .r{text-align:right;font-size:12px;color:var(--mut)}
.tag{font-size:11px;padding:2px 7px;border-radius:8px;font-weight:700}
.tag.pub{background:#ccfbf1;color:#0f766e}
.tag.prv{background:#f1f5f9;color:var(--mut)}
.tag.off{background:#fef2f2;color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px 5px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap}
th{background:#f8fafc;color:var(--mut);font-size:11px}
tr.off td{background:#fef2f2}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tab{padding:8px 14px;border-radius:20px;background:#fff;border:1px solid var(--bd);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.tab.act{background:var(--navy);color:#fff;border-color:var(--navy)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);display:none;z-index:10}
body.inapp nav{display:flex}
nav button{flex:1;padding:9px 0 max(9px, env(safe-area-inset-bottom));border:none;background:none;font-size:11px;color:var(--mut);cursor:pointer}
nav button.act{color:var(--navy);font-weight:800}
nav button span{display:block;font-size:20px;margin-bottom:1px}
.m-ok{color:var(--grn);font-weight:700}.m-warn{color:var(--amb);font-weight:700}.m-due{color:var(--red);font-weight:700}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;border-radius:16px 16px 0 0;padding:20px 16px 30px;width:100%;max-width:640px;max-height:88vh;overflow-y:auto}
.modal h3{color:var(--navy);margin-bottom:6px}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:30;display:none;white-space:nowrap}
.tbl-wrap{overflow-x:auto}
.stat{display:flex;gap:8px;margin-bottom:12px}
.stat .card{flex:1;text-align:center;margin:0;padding:12px 6px}
.stat .n{font-size:20px;font-weight:800;color:var(--navy)}
.stat .l{font-size:11px;color:var(--mut)}
.del{color:var(--red);cursor:pointer;font-weight:700}
/* 로그인 화면 */
#login{min-height:100vh;display:flex;align-items:center;justify-content:flex-end;padding:32px clamp(44px,8vw,150px) 32px 24px;
position:relative;isolation:isolate;background:#f7fbfd url("fleet-login-bg.png") center center/cover no-repeat}
#login::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
background:linear-gradient(90deg,rgba(255,255,255,0) 42%,rgba(255,255,255,.12) 58%,rgba(255,255,255,.48) 100%)}
.login-card{position:relative;overflow:hidden;background:rgba(255,255,255,.93);border:1px solid rgba(255,255,255,.96);
backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:22px;padding:34px 30px 28px;width:100%;max-width:390px;
box-shadow:0 22px 60px rgba(53,87,111,.20),0 4px 18px rgba(25,70,96,.10)}
.login-card::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;
background:linear-gradient(90deg,#12b3c7 0%,#18b6aa 52%,#9bd400 100%)}
.login-card img{display:block;margin:0 auto 12px;max-width:220px;height:auto}
.login-kicker{text-align:center;margin:0 0 21px;color:#607588;font-size:10px;font-weight:800;letter-spacing:2.1px}
.login-card label{color:#40566a;font-weight:700}
.login-card input{border-color:#cfdae3;background:rgba(255,255,255,.92);transition:border-color .2s,box-shadow .2s}
.login-card input:focus{outline:none;border-color:#12b3b3;box-shadow:0 0 0 3px rgba(18,179,179,.14)}
.login-card .btn{background:linear-gradient(135deg,#415165 0%,#33465b 58%,#237b7d 100%)!important;

.login-card .btn:hover{transform:translateY(-1px);box-shadow:0 11px 22px rgba(32,104,107,.24)}
.login-card .chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);margin-top:10px}
.login-card .chk input{width:auto}
.login-card .note{margin-top:18px;background:linear-gradient(135deg,#435368,#34485d);color:#edf5f7;
border-left:4px solid #12b3b3;border-radius:11px;padding:13px 14px;font-size:12px;line-height:1.6}
@media(max-width:800px){

  .login-card{max-width:420px;padding:30px 22px 24px;border-radius:18px}
  .login-card img{max-width:200px}
}
.notice-body{white-space:pre-wrap;font-size:14px;line-height:1.7;margin:10px 0;max-height:45vh;overflow-y:auto}
</style>

let useFB=false, fdb=null;

  const c=window.FIREBASE_CONFIG||{};

const LS={
  get(k){ try{return JSON.parse(localStorage.getItem("jhc2_"+k))||[]}catch(e){return[]} },
  set(k,v){ localStorage.setItem("jhc2_"+k,JSON.stringify(v)) }
};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
async function dbAll(col){
  if(useFB){ const s=await fdb.collection(col).get(); return s.docs.map(d=>({id:d.id,...d.data()})); }
  return LS.get(col);
}
async function dbAdd(col,obj){
  if(useFB){ const r=await fdb.collection(col).add(obj); return r.id; }
  obj.id=uid(); const a=LS.get(col); a.push(obj); LS.set(col,a); return obj.id;
}
async function dbUpd(col,id,patch){
  if(useFB){ await fdb.collection(col).doc(id).set(patch,{merge:true}); return; }
  const a=LS.get(col); const i=a.findIndex(x=>x.id===id); if(i>-1){Object.assign(a[i],patch);LS.set(col,a);}
}
async function dbDel(col,id){
  if(useFB){ await fdb.collection(col).doc(id).delete(); return; }
  LS.set(col,LS.get(col).filter(x=>x.id!==id));
}
async function getSettings(){
  if(useFB){ const d=await fdb.collection("settings").doc("main").get(); return d.exists?d.data():null; }
  const a=LS.get("settings"); return a.length?a[0]:null;
}
async function saveSettings(s){
  if(useFB){ await fdb.collection("settings").doc("main").set(s,{merge:true}); return; }
  const cur=(LS.get("settings")[0])||{}; LS.set("settings",[Object.assign(cur,s)]);
}

    for(const col of ["vehicles","users","accounts"]){
      const old=await dbAll(col); for(const o of old) await dbDel(col,o.id);
    }
    for(const v of SEED_VEHICLES) await dbAdd("vehicles",{...v,active:true});
    for(const dept of Object.keys(SEED_ORG)) for(const name of SEED_ORG[dept])
      await dbAdd("accounts",{name,dept,userId:name,pw:name,vehicle:SEED_VMAP[name]||""});
    st=Object.assign({adminId:"jhintex",adminPw:"jhintex",extraHolidays:"",seedV:2},st||{});
    st.seedV=2; await saveSettings(st);
  }
  SETTINGS=st;
}
async function loadCore(){
  VEHICLES=(await dbAll("vehicles")).filter(v=>v.active!==false).sort((a,b)=>(a.dept||"").localeCompare(b.dept||"")||a.plate.localeCompare(b.plate));
  ACCOUNTS=(await dbAll("accounts")).sort((a,b)=>a.dept.localeCompare(b.dept)||a.name.localeCompare(b.name));
  SETTINGS=(await getSettings())||SETTINGS;
}

/* ═══════════ 유틸 ═══════════ */
const $=s=>document.querySelector(s);
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const nowTime=()=>{const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
function isOffday(ds){
  const d=new Date(ds+"T00:00:00"); const w=d.getDay();
  if(w===0||w===6) return true;
  const extra=(SETTINGS.extraHolidays||"").split(/[\s,]+/).filter(Boolean);
  return HOLIDAYS.includes(ds)||extra.includes(ds);
}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>n==null||n===""?"-":Number(n).toLocaleString();
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",2500);}
function modal(html){$("#modal-root").innerHTML='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">'+html+'</div></div>';}
function closeModal(){$("#modal-root").innerHTML="";}
async function vehicleTrips(plate){ return (await dbAll("trips")).filter(t=>t.vehicle===plate); }
function lastKm(trips){ let m=0; for(const t of trips){ if(t.endKm&&+t.endKm>m)m=+t.endKm; if(t.startKm&&+t.startKm>m)m=+t.startKm;} return m; }
function openTrip(trips){ return trips.filter(t=>t.status==="운행중").sort((a,b)=>(b.date+b.startTime).localeCompare(a.date+a.startTime))[0]; }

const seenNotices=new Set();

function maintAlerts(plate,trips,recs){
  const cur=lastKm(trips); const out=[];
  for(const it of MAINT_ITEMS){
    const last=recs.filter(r=>r.vehicle===plate&&r.item===it.name).sort((a,b)=>b.date.localeCompare(a.date))[0];
    if(!last) continue;
    if(it.km&&cur){ const rem=it.km-(cur-(+last.km||0));
      if(rem<=0) out.push(`<span class="m-due">${esc(it.name)} 교체시기 ${fmt(-rem)}km 초과</span>`);
      else if(rem<=1000) out.push(`<span class="m-warn">${esc(it.name)} ${fmt(rem)}km 남음</span>`);}
    if(it.mo){ const due=new Date(last.date); due.setMonth(due.getMonth()+it.mo);
      const dd=Math.round((due-new Date())/864e5);
      if(dd<=0) out.push(`<span class="m-due">${esc(it.name)} 교체기간 경과</span>`);
      else if(dd<=30) out.push(`<span class="m-warn">${esc(it.name)} ${dd}일 남음</span>`);}
  }
  return out.length?`<div class="banner warn" style="font-weight:400">🔧 <b>소모품 알림</b><br>${out.join(" · ")}</div>`:"";
}

async function dlBook(){
  const from=$("#bF").value,to=$("#bT").value,only=$("#bV").value;
  const trips=(await dbAll("trips")).filter(t=>t.status==="완료"&&(!from||t.date>=from)&&(!to||t.date<=to)).sort((a,b)=>(a.date+(a.startTime||"")).localeCompare(b.date+(b.startTime||"")));
  const vlist=only?VEHICLES.filter(v=>v.plate===only):VEHICLES;
  const wb=XLSX.utils.book_new();
  let made=0;
  for(const v of vlist){
    const rows=trips.filter(t=>t.vehicle===v.plate);
    if(!rows.length&&!only) continue;
    const total=rows.reduce((s,t)=>s+(+t.dist||0),0);
    const aoa=[
      ["업무용승용차 운행기록부"],
      ["과세기간:",from+" ~ "+to,"","법인명:",COMPANY],
      ["차종:",v.model,"","자동차등록번호:",v.plate],
      [],
      ["사용일자","부서","성명","주행 전 계기판거리(km)","주행 후 계기판거리(km)","주행거리(km)","업무용 사용거리(km)","비고"],
      ...rows.map(t=>[t.date,t.dept,t.user,t.startKm,t.endKm,t.dist,t.dist,(t.purpose||"")+(t.offday?" [휴무일 운행]":"")]),
      [],
      ["과세기간 합계","","","","",total,total,""],
      ["업무사용비율","100%"]
    ];
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"]=[{wch:12},{wch:14},{wch:9},{wch:18},{wch:18},{wch:12},{wch:15},{wch:22}];
    XLSX.utils.book_append_sheet(wb,ws,v.plate.replace(/[\\\/\?\*\[\]:]/g,""));
    made++;
  }
  if(!made) return toast("해당 기간 완료된 운행기록이 없습니다");
  XLSX.writeFile(wb,`운행기록부_${from.replace(/-/g,"")}-${to.replace(/-/g,"")}.xlsx`);
}

  $("#aBody").innerHTML=`<div class="card"><button class="btn sm grn" onclick="accForm()">＋ 계정 추가</button>
  <p class="sub" style="margin-top:6px">초기 계정: ID=PW=이름 (조직도 기준, 회장님·사장님 제외) · 본인이 앱에서 PW 변경 가능</p></div>
  <div class="card"><div class="tbl-wrap"><table><thead><tr><th>이름</th><th>ID</th><th>부서</th><th>지정차량</th><th></th><th></th><th></th></tr></thead><tbody>
  ${ACCOUNTS.map(a=>`<tr><td><b>${esc(a.name)}</b></td><td>${esc(a.userId)}</td><td>${esc(a.dept)}</td><td>${a.vehicle?esc(a.vehicle):"-"}</td>
  <td><button class="btn sm sec" onclick="accForm('${a.id}')">수정</button></td>
  <td><button class="btn sm sec" onclick="if(confirm('${esc(a.name)} PW를 이름(초기값)으로 초기화할까요?'))resetPw('${a.id}','${esc(a.name)}')">PW초기화</button></td>
  <td class="del" onclick="if(confirm('${esc(a.name)} 계정을 삭제할까요?'))delAcc('${a.id}')">✕</td></tr>`).join("")}
  </tbody></table></div></div>`;
}
function accForm(id){
  const a=id?ACCOUNTS.find(x=>x.id===id):{name:"",userId:"",dept:"",vehicle:""};
  const assigned=new Set(ACCOUNTS.filter(x=>x.id!==id&&x.vehicle).map(x=>x.vehicle));
  const opts=VEHICLES.filter(v=>v.type==="전용"&&(!assigned.has(v.plate)||v.plate===a.vehicle));
  modal(`<h3>${id?"계정 수정 (부서이동·차량지정)":"계정 추가"}</h3>
  <label>이름</label><input id="aN" value="${esc(a.name)}">
  <label>ID</label><input id="aI" value="${esc(a.userId)}" placeholder="비우면 이름과 동일">
  ${id?"":`<label>초기 PW</label><input id="aP" placeholder="비우면 이름과 동일">`}
  <label>부서</label><input id="aD" value="${esc(a.dept)}" list="deptListA">
  <datalist id="deptListA">${[...new Set(ACCOUNTS.map(x=>x.dept).concat(Object.keys(SEED_ORG)))].map(d=>`<option value="${esc(d)}">`).join("")}</datalist>
  <label>지정 전용차량</label><select id="aV"><option value="">없음 (공용만 이용)</option>${opts.map(v=>`<option value="${esc(v.plate)}" ${v.plate===a.vehicle?"selected":""}>${esc(v.plate)} ${esc(v.model)}</option>`).join("")}</select>
  <button class="btn" onclick="saveAcc('${id||""}')">저장</button><button class="btn sec" onclick="closeModal()">취소</button>`);
}
async function saveAcc(id){
  const name=$("#aN").value.trim(); if(!name) return toast("이름을 입력하세요");
  const o={name,userId:($("#aI").value.trim()||name),dept:$("#aD").value.trim(),vehicle:$("#aV").value};
  if(!o.dept) return toast("부서를 입력하세요");
  if(!id){ o.pw=($("#aP").value||name); const dup=ACCOUNTS.find(a=>a.userId===o.userId); if(dup) return toast("이미 존재하는 ID입니다"); await dbAdd("accounts",o); }
  else await dbUpd("accounts",id,o);
  closeModal(); toast("저장됨"); nav("admin");
}
async function resetPw(id,name){ await dbUpd("accounts",id,{pw:name}); toast("PW가 이름으로 초기화됨"); }
async function delAcc(id){ await dbDel("accounts",id); toast("계정 삭제됨"); nav("admin"); }
async function aMaint(){
  const recs=(await dbAll("maintenance")).sort((a,b)=>b.date.localeCompare(a.date));
  $("#aBody").innerHTML=`<div class="card"><h2>전체 소모품 교체 이력</h2><div class="tbl-wrap"><table><thead><tr><th>일자</th><th>차량</th><th>항목</th><th>km</th><th>정비소</th><th>비용</th><th>내역</th><th>입력자</th><th></th></tr></thead><tbody>
  ${recs.slice(0,100).map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.vehicle)}</td><td>${esc(r.item)}</td><td>${fmt(r.km)}</td><td>${esc(r.shop||"")}</td><td>${r.cost?fmt(r.cost):""}</td><td>${esc(maintDetail(r))}</td><td>${esc(r.by||"")}</td><td class="del" onclick="if(confirm('삭제할까요?'))delMaintRec('${r.id}')">✕</td></tr>`).join("")||"<tr><td colspan=9>기록 없음</td></tr>"}
  </tbody></table></div></div>`;
}
async function delMaintRec(id){ await dbDel("maintenance",id); toast("삭제됨"); nav("admin"); }
async function aNotice(){
  const ns=(await dbAll("notices")).sort((a,b)=>b.date.localeCompare(a.date));
  $("#aBody").innerHTML=`
  <div class="card"><h2>📢 공지 등록</h2>
    <p class="sub">등록하면 전 직원 로그인 시 팝업으로 표시됩니다.</p>
    <label>제목</label><input id="ntT" placeholder="예: 2026년 하계 휴가 대비 차량 반납 안내">
    <label>내용</label><textarea id="ntB" rows="6" placeholder="공지 내용"></textarea>
    <button class="btn sm grn" onclick="addNotice()">등록</button></div>
  <div class="card"><h2>공지 목록</h2><div class="tbl-wrap"><table><thead><tr><th>일자</th><th>제목</th><th>상태</th><th></th><th></th></tr></thead><tbody>
  ${ns.map(n=>`<tr><td>${esc(n.date)}</td><td style="text-align:left">${esc(n.title)}</td><td>${n.active!==false?"게시중":"중단"}</td>
  <td><button class="btn sm sec" onclick="toggleNotice('${n.id}',${n.active!==false})">${n.active!==false?"게시중단":"재게시"}</button></td>
  <td class="del" onclick="if(confirm('삭제할까요?'))delNotice('${n.id}')">✕</td></tr>`).join("")||"<tr><td colspan=5>공지 없음</td></tr>"}
  </tbody></table></div></div>`;
}
async function addNotice(){
  const t=$("#ntT").value.trim(),b=$("#ntB").value.trim();
  if(!t||!b) return toast("제목과 내용을 입력하세요");
  await dbAdd("notices",{title:t,body:b,date:todayStr(),active:true});
  toast("공지 등록됨 — 직원 로그인 시 팝업 표시"); nav("admin");
}
async function toggleNotice(id,cur){ await dbUpd("notices",id,{active:!cur}); nav("admin"); }
async function delNotice(id){ await dbDel("notices",id); toast("삭제됨"); nav("admin"); }
async function aSet(){
  $("#aBody").innerHTML=`
  <div class="card"><h2>관리자 계정 변경</h2>
    <label>관리자 ID</label><input id="nadId" value="${esc(SETTINGS.adminId)}">
    <label>새 비밀번호 (비우면 유지)</label><input type="password" id="nadPw">
    <button class="btn sm" onclick="chAdmin()">변경</button></div>
  <div class="card"><h2>추가 휴무일(공휴일) 등록</h2>
    <p class="sub">기본: 토·일요일 + 법정공휴일(2026~2027 내장). 임시휴무·창립기념일 등을 YYYY-MM-DD 형식으로 추가.</p>
    <textarea id="exh" rows="4" placeholder="2026-08-14">${esc(SETTINGS.extraHolidays||"")}</textarea>
    <button class="btn sm" onclick="saveExh()">저장</button></div>
  <div class="card"><h2>저장 모드</h2><p class="sub">${useFB?"✅ Firebase 서버 연결됨 — 모든 기기의 기록이 실시간 공유됩니다.":"⚠️ 기기저장 모드 — 이 기기에만 저장됩니다. firebase-config.js 를 설정하면 전 직원 기록이 공유됩니다 (가이드 참고)."}</p></div>
  <button class="btn red" onclick="logout()">로그아웃</button>`;
}
async function chAdmin(){
  const id=$("#nadId").value.trim(), p=$("#nadPw").value;
  if(!id) return toast("ID를 입력하세요");
  const patch={adminId:id}; if(p){ if(p.length<4) return toast("PW는 4자 이상"); patch.adminPw=p; }
  await saveSettings(patch); Object.assign(SETTINGS,patch); toast("관리자 계정 변경됨");
}
async function saveExh(){ await saveSettings({extraHolidays:$("#exh").value.trim()}); SETTINGS.extraHolidays=$("#exh").value.trim(); toast("저장됨"); }
