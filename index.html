<style>

.metric-label{font-size:12px;color:var(--mut);font-weight:700}.metric-value{font-size:29px;line-height:1.05;color:var(--navy);font-weight:900;margin-top:15px;letter-spacing:-1px}.metric-note{font-size:11px;color:var(--mut);margin-top:5px}

nav button{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:12px 13px;border:0;border-radius:10px;background:transparent;color:#b7cad8;font-size:13px;font-weight:700;cursor:pointer;text-align:left;margin:2px 0}nav button:hover{background:rgba(255,255,255,.07);color:#fff}nav button.act{background:rgba(18,179,168,.18);color:#fff}nav button.act::before{content:"";position:absolute;left:-16px;width:3px;height:24px;border-radius:0 4px 4px 0;background:linear-gradient(var(--teal),var(--lime))}.nav-icon{display:flex;align-items:center;justify-content:center;width:24px;height:24px;font-size:16px;color:#8ddbd4}.nav-label{display:block}

@media(max-width:620px){.metrics-grid{grid-template-columns:1fr 1fr;gap:10px}.metric-card{min-height:112px;padding:14px}.metric-value{font-size:24px;margin-top:11px}.fleet-grid{grid-template-columns:1fr}.form-grid,.filter-bar{grid-template-columns:1fr}.form-grid .span-2{grid-column:auto}.row{flex-direction:column;gap:0}.stat{grid-template-columns:1fr 1fr}.card,.panel{padding:16px;border-radius:14px}.dashboard-grid{gap:12px}#login{justify-content:center;align-items:flex-start;padding:clamp(28px,8vh,72px) 16px 24px;background-position:34% center}#login::before{background:rgba(244,250,253,.34)}.login-card{max-width:420px;padding:30px 22px 24px;border-radius:18px}.login-card img{max-width:200px}}

</style>
</head>

<div id="login"></div>
<header>

/* ═══════════ 저장소 (Firebase ↔ 기기저장 자동 전환) ═══════════ */
let useFB=false, fdb=null;
try{
  const c=window.FIREBASE_CONFIG||{};
  if(c.apiKey && !/여기에/.test(c.apiKey)){ firebase.initializeApp(c); fdb=firebase.firestore(); useFB=true; }
}catch(e){ console.warn("Firebase 초기화 실패 → 기기저장 모드", e); }
const LS={
  get(k){ try{return JSON.parse(localStorage.getItem("jhc2_"+k))||[]}catch(e){return[]} },
  set(k,v){ localStorage.setItem("jhc2_"+k,JSON.stringify(v)) }
};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
async function dbAll(col){
  if(useFB){ const s=await fdb.collection(col).get(); return s.docs.map(d=>({id:d.id,...d.data()})); }
  return LS.get(col);
}
async function dbAdd(col,obj){
  if(useFB){ const r=await fdb.collection(col).add(obj); return r.id; }
  obj.id=uid(); const a=LS.get(col); a.push(obj); LS.set(col,a); return obj.id;
}
async function dbUpd(col,id,patch){
  if(useFB){ await fdb.collection(col).doc(id).set(patch,{merge:true}); return; }
  const a=LS.get(col); const i=a.findIndex(x=>x.id===id); if(i>-1){Object.assign(a[i],patch);LS.set(col,a);}
}
async function dbDel(col,id){
  if(useFB){ await fdb.collection(col).doc(id).delete(); return; }
  LS.set(col,LS.get(col).filter(x=>x.id!==id));
}
async function getSettings(){
  if(useFB){ const d=await fdb.collection("settings").doc("main").get(); return d.exists?d.data():null; }
  const a=LS.get("settings"); return a.length?a[0]:null;
}
async function saveSettings(s){
  if(useFB){ await fdb.collection("settings").doc("main").set(s,{merge:true}); return; }
  const cur=(LS.get("settings")[0])||{}; LS.set("settings",[Object.assign(cur,s)]);
}

let VEHICLES=[],ACCOUNTS=[],SETTINGS={};
async function ensureSeed(){
  let st=await getSettings();
  if(!st||st.seedV!==2){
    // 구버전 데이터 정리 후 v2 시드
    for(const col of ["vehicles","users","accounts"]){
      const old=await dbAll(col); for(const o of old) await dbDel(col,o.id);
    }
    for(const v of SEED_VEHICLES) await dbAdd("vehicles",{...v,active:true});
    for(const dept of Object.keys(SEED_ORG)) for(const name of SEED_ORG[dept])
      await dbAdd("accounts",{name,dept,userId:name,pw:name,vehicle:SEED_VMAP[name]||""});
    st=Object.assign({adminId:"jhintex",adminPw:"jhintex",extraHolidays:"",seedV:2},st||{});
    st.seedV=2; await saveSettings(st);
  }
  SETTINGS=st;
}
async function loadCore(){
  VEHICLES=(await dbAll("vehicles")).filter(v=>v.active!==false).sort((a,b)=>(a.dept||"").localeCompare(b.dept||"")||a.plate.localeCompare(b.plate));
  ACCOUNTS=(await dbAll("accounts")).sort((a,b)=>a.dept.localeCompare(b.dept)||a.name.localeCompare(b.name));
  SETTINGS=(await getSettings())||SETTINGS;
}

function isOffday(ds){
  const d=new Date(ds+"T00:00:00"); const w=d.getDay();
  if(w===0||w===6) return true;
  const extra=(SETTINGS.extraHolidays||"").split(/[\s,]+/).filter(Boolean);
  return HOLIDAYS.includes(ds)||extra.includes(ds);
}

function isAdmin(){ return SESSION&&SESSION.role==="admin"&&SESSION.aid==="__admin"; }
const MAX_ASSIGNED_VEHICLES=3;
function accountVehiclePlates(account){
  if(!account) return [];
  const raw=Array.isArray(account.vehicles)&&account.vehicles.length?account.vehicles:(account.vehicle?[account.vehicle]:[]);
  return [...new Set(raw.filter(Boolean))].slice(0,MAX_ASSIGNED_VEHICLES);
}
function userSession(acc){
  const vehicles=accountVehiclePlates(acc);
  return {aid:acc.id,name:acc.name,dept:acc.dept,role:"user",vehicle:vehicles[0]||"",vehicles};
}
function vehicleOwners(plate){ return ACCOUNTS.filter(a=>accountVehiclePlates(a).includes(plate)); }
function vehicleOwnerNames(plate){ return vehicleOwners(plate).map(a=>a.name).join(", "); }

async function doLogin(){
  const id=$("#liId").value.trim(), pw=$("#liPw").value;
  if(!id||!pw) return toast("ID와 PW를 입력하세요");
  await ensureSeed(); await loadCore();
  if($("#liSave").checked) localStorage.setItem("jhc2_saveid",id); else localStorage.removeItem("jhc2_saveid");
  if(id===SETTINGS.adminId&&pw===SETTINGS.adminPw){
    SESSION={aid:"__admin",name:"총무부 관리자",dept:"인사총무팀",role:"admin",vehicle:"",vehicles:[]};
    saveSession(); return enterApp(true);
  }
  const acc=ACCOUNTS.find(a=>a.userId===id&&a.pw===pw);
  if(!acc) return toast("ID 또는 비밀번호가 올바르지 않습니다");
  SESSION=userSession(acc);
  saveSession(); enterApp(true);
}

const seenNotices=new Set();
async function showNotices(){
  const ns=(await dbAll("notices")).filter(n=>n.active!==false).sort((a,b)=>b.date.localeCompare(a.date));
  const show=ns.filter(n=>!seenNotices.has(n.id)&&localStorage.getItem("jhc2_nhide_"+n.id)!==todayStr());
  if(!show.length) return;
  const n=show[0];
  modal(`<h3>📢 ${esc(n.title)}</h3><p class="sub">${esc(n.date)} · 총무부(관리부서)</p>
  <div class="notice-body">${esc(n.body)}</div>
  ${show.length>1?`<p class="sub">외 공지 ${show.length-1}건 — 닫으면 이어서 표시됩니다.</p>`:""}
  <div class="chk" style="display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mut)"><input type="checkbox" id="nHide" style="width:auto"><label for="nHide" style="margin:0">오늘 하루 이 공지 열지 않기</label></div>
  <button class="btn" onclick="closeNotice('${n.id}')">닫기</button>`);
}
function closeNotice(id){
  if($("#nHide")&&$("#nHide").checked) localStorage.setItem("jhc2_nhide_"+id,todayStr());
  seenNotices.add(id);
  closeModal(); showNotices();
}

function visibleVehicles(){
  if(isAdmin()) return VEHICLES;
  const assigned=new Set(accountVehiclePlates(SESSION));
  return VEHICLES.filter(v=>assigned.has(v.plate));
}
function canAccessVehicle(plate){
  return !!plate&&(isAdmin()||accountVehiclePlates(SESSION).includes(plate));
}
function denyVehicleAccess(){ toast("지정되지 않은 차량에는 접근할 수 없습니다."); }
function syncSessionAccount(){
  if(!SESSION||isAdmin()) return true;
  const acc=ACCOUNTS.find(a=>a.id===SESSION.aid);
  if(!acc){ logout(); return false; }
  SESSION=userSession(acc);
  saveSession();
  const nameEl=$("#uName"),deptEl=$("#uDept");
  if(nameEl) nameEl.textContent=SESSION.name;
  if(deptEl) deptEl.textContent=SESSION.dept||"재현하늘창";
  return true;
}

function maintAlerts(plate,trips,recs){
  const cur=lastKm(trips); const out=[];
  for(const it of MAINT_ITEMS){
    const last=recs.filter(r=>r.vehicle===plate&&r.item===it.name).sort((a,b)=>b.date.localeCompare(a.date))[0];
    if(!last) continue;
    if(it.km&&cur){ const rem=it.km-(cur-(+last.km||0));
      if(rem<=0) out.push(`<span class="m-due">${esc(it.name)} 교체시기 ${fmt(-rem)}km 초과</span>`);
      else if(rem<=1000) out.push(`<span class="m-warn">${esc(it.name)} ${fmt(rem)}km 남음</span>`);}
    if(it.mo){ const due=new Date(last.date); due.setMonth(due.getMonth()+it.mo);
      const dd=Math.round((due-new Date())/864e5);
      if(dd<=0) out.push(`<span class="m-due">${esc(it.name)} 교체기간 경과</span>`);
      else if(dd<=30) out.push(`<span class="m-warn">${esc(it.name)} ${dd}일 남음</span>`);}
  }
  return out.length?`<div class="banner warn" style="font-weight:400">🔧 <b>소모품 알림</b><br>${out.join(" · ")}</div>`:"";
}

/* ═══════════ Fleet Command 요약 계산 ═══════════ */
function localDateValue(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function maintenanceState(plate,trips,recs){
  const cur=lastKm(trips), alerts=[];
  for(const it of MAINT_ITEMS){
    const last=recs.filter(r=>r.vehicle===plate&&r.item===it.name).sort((a,b)=>b.date.localeCompare(a.date))[0];
    if(!last) continue;
    let level="ok", label="정상", nextDate="";
    if(it.km&&cur){
      const rem=it.km-(cur-(+last.km||0));
      if(rem<=0){ level="due"; label=`${fmt(-rem)}km 초과`; }
      else if(rem<=1000){ level="warn"; label=`${fmt(rem)}km 남음`; }
      else label=`${fmt(rem)}km 남음`;
    }
    if(it.mo){
      const due=new Date(last.date+"T00:00:00"); due.setMonth(due.getMonth()+it.mo);
      nextDate=localDateValue(due);
      const dd=Math.ceil((due-new Date())/864e5);
      if(dd<=0){ level="due"; label="기간 경과"; }
      else if(dd<=30&&level!=="due"){ level="warn"; label=`${dd}일 남음`; }
    }
    alerts.push({plate,item:it.name,level,label,lastDate:last.date,nextDate,cost:+last.cost||0,km:+last.km||0});
  }
  const level=alerts.some(a=>a.level==="due")?"due":alerts.some(a=>a.level==="warn")?"warn":alerts.length?"ok":"unknown";
  return {level,alerts,cur};
}
function vehicleOperationalState(v,trips,recs){
  const vt=trips.filter(t=>t.vehicle===v.plate), running=openTrip(vt), maint=maintenanceState(v.plate,vt,recs);
  if(running) return {level:"run",label:"운행 중",running,maint};
  if(maint.level==="due") return {level:"due",label:"점검 필요",running:null,maint};
  if(maint.level==="warn") return {level:"warn",label:"점검 예정",running:null,maint};
  if(maint.level==="unknown") return {level:"unknown",label:"점검 이력 없음",running:null,maint};
  return {level:"ok",label:"운행 가능",running:null,maint};
}
function statusBadge(state){ return `<span class="status-pill ${state.level}">${esc(state.label)}</span>`; }

async function dlBook(){
  const from=$("#bF").value,to=$("#bT").value,only=$("#bV").value;
  const trips=(await dbAll("trips")).filter(t=>t.status==="완료"&&(!from||t.date>=from)&&(!to||t.date<=to)).sort((a,b)=>(a.date+(a.startTime||"")).localeCompare(b.date+(b.startTime||"")));
  const vlist=only?VEHICLES.filter(v=>v.plate===only):VEHICLES;
  const wb=XLSX.utils.book_new();
  let made=0;
  for(const v of vlist){
    const rows=trips.filter(t=>t.vehicle===v.plate);
    if(!rows.length&&!only) continue;
    const total=rows.reduce((s,t)=>s+(+t.dist||0),0);
    const aoa=[
      ["업무용승용차 운행기록부"],
      ["과세기간:",from+" ~ "+to,"","법인명:",COMPANY],
      ["차종:",v.model,"","자동차등록번호:",v.plate],
      [],
      ["사용일자","부서","성명","주행 전 계기판거리(km)","주행 후 계기판거리(km)","주행거리(km)","업무용 사용거리(km)","비고"],
      ...rows.map(t=>[t.date,t.dept,t.user,t.startKm,t.endKm,t.dist,t.dist,(t.purpose||"")+(t.offday?" [휴무일 운행]":"")]),
      [],
      ["과세기간 합계","","","","",total,total,""],
      ["업무사용비율","100%"]
    ];
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"]=[{wch:12},{wch:14},{wch:9},{wch:18},{wch:18},{wch:12},{wch:15},{wch:22}];
    XLSX.utils.book_append_sheet(wb,ws,v.plate.replace(/[\\\/\?\*\[\]:]/g,""));
    made++;
  }
  if(!made) return toast("해당 기간 완료된 운행기록이 없습니다");
  XLSX.writeFile(wb,`운행기록부_${from.replace(/-/g,"")}-${to.replace(/-/g,"")}.xlsx`);
}

function limitVehicleChecks(el){
  const checked=[...document.querySelectorAll('input[name="aVehicle"]:checked')];
  if(checked.length>MAX_ASSIGNED_VEHICLES){ el.checked=false; toast(`지정 차량은 최대 ${MAX_ASSIGNED_VEHICLES}대입니다`); }
  const count=document.querySelectorAll('input[name="aVehicle"]:checked').length, out=$("#aVCount");
  if(out) out.textContent=`${count}/${MAX_ASSIGNED_VEHICLES}대 선택`;
}
async function saveAcc(id){
  if(!isAdmin()) return toast("관리자만 계정과 차량 지정을 저장할 수 있습니다");
  const name=$("#aN").value.trim(); if(!name) return toast("이름을 입력하세요");
  const vehicles=[...document.querySelectorAll('input[name="aVehicle"]:checked')].map(el=>el.value);
  if(vehicles.length>MAX_ASSIGNED_VEHICLES) return toast(`지정 차량은 최대 ${MAX_ASSIGNED_VEHICLES}대입니다`);
  const o={name,userId:($("#aI").value.trim()||name),dept:$("#aD").value.trim(),vehicle:vehicles[0]||"",vehicles};
  if(!o.dept) return toast("부서를 입력하세요");
  if(!id){ o.pw=($("#aP").value||name); const dup=ACCOUNTS.find(a=>a.userId===o.userId); if(dup) return toast("이미 존재하는 ID입니다"); await dbAdd("accounts",o); }

  closeModal(); toast("저장됨"); nav("admin");
}
